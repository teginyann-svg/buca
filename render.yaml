# Blueprint Render — API Reservsalon
# Docs : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reservsalon-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:api
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/holidays
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGINS
        value: https://kod200.com,https://www.kod200.com
      - key: SALON_ADMIN_CODE
        sync: false
      # Recommandé : disque monté + DATA_DIR=/var/data (sinon /tmp, perdu au sleep)
      - key: DATA_DIR
        sync: false
